name: Feature request
description: Propose a WeaMachine improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation are you hitting?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Step sequencer
        - PLC I/O
        - Servo / motion
        - UI / QML
        - Build / CI / docs
        - Other
    validations:
      required: true
